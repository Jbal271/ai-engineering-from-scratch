services:
  ai-dev:
    image: ai-course-cpu:latest
    volumes:
      - .:/workspace
    command: ["python", "-c", "import time; time.sleep(86400)"]

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
